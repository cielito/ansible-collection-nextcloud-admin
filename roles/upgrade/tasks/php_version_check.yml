---
# Check PHP version compatibility

- name: Get current PHP version
  ansible.builtin.command: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
  register: _php_version_result
  changed_when: false

- name: Set PHP version fact
  ansible.builtin.set_fact:
    current_php_version: "{{ _php_version_result.stdout | trim }}"

- name: Get PHP requirements for target version
  ansible.builtin.set_fact:
    php_min_version: "{{ nextcloud_php_requirements[current_step_nextcloud_version.split('.')[0]].min }}"
    php_max_version: "{{ nextcloud_php_requirements[current_step_nextcloud_version.split('.')[0]].max }}"
    php_rec_version: "{{ nextcloud_php_requirements[current_step_nextcloud_version.split('.')[0]].rec }}"

- name: Check if PHP version is compatible with Nextcloud {{ current_step_nextcloud_version }}
  ansible.builtin.set_fact:
    _php_version_compatible: "{{ current_php_version is version(php_min_version, '>=') and current_php_version is version(php_max_version, '<=') }}"

- name: Fail if PHP version is incompatible and upgrade is disabled
  ansible.builtin.fail:
    msg: >-
      PHP {{ current_php_version }} is not compatible with Nextcloud {{ current_step_nextcloud_version }}.
      Required: PHP >= {{ php_min_version }} and <= {{ php_max_version }}.
      Set nextcloud_upgrade_php to true to enable automatic PHP upgrades.
  when:
    - not _php_version_compatible
    - not nextcloud_upgrade_php

- name: Determine target PHP version
  ansible.builtin.set_fact:
    _php_target_version: >-
      {% if distro_php_version is defined
         and distro_php_version is version(php_min_version, '>=')
         and distro_php_version is version(php_max_version, '<=') -%}
        {{ distro_php_version }}
      {%- elif nextcloud_upgrade_php_rec -%}
        {{ php_rec_version }}
      {%- else -%}
        {{ php_max_version }}
      {%- endif %}
  when:
    - not _php_version_compatible
    - nextcloud_upgrade_php

- name: "Upgrade PHP to {{ _php_target_version | default('') }}"
  ansible.builtin.include_tasks: php_upgrade.yml
  vars:
    php_version: "{{ _php_target_version | default(omit) }}"
  when:
    - not _php_version_compatible
    - nextcloud_upgrade_php

- name: PHP version is compatible
  ansible.builtin.debug:
    msg: "PHP {{ current_php_version }} is compatible with Nextcloud {{ current_step_nextcloud_version }}."
  when: _php_version_compatible

...
